            日期 | 收支类型 | 分类 | 事项 | 金额（元）| 备注；\n防重复规则：仅根据输入中实际存在的支出/收入数量输出，不重复、不编造、不遗漏。\n\
            删冗规则：去除所有解释、示例、问候等不必要语句。\n**防重复铁律**：\n   - ❌ 禁止输出 2 条及以上。\n   - ❌ 禁止解释、示例、问候。\n\
            \   - ❌ 禁止联想其他记录。\n只管单次对话框里的内容\n   - ✅ 输入只有 1 条，输出就只有 1 条。"
