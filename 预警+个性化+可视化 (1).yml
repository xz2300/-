        prompt_template:
        - id: 6ee50654-270c-4258-86c9-a1f9e1d96bbf
          role: system
          text: '你只输出纯SQL，不输出任何文字、思考、解释、换行、符号。

            根据日期{{#1780493063452.text#}}生成SQL。


            【表】public.expenses

            【字段】id, date, type, amount, month_budget, bill_month


            【必须满足】

            1. 先查当月预算 monthly_budget

            2. 再算当月总支出 total_spent

            3. 支出必须带 id = ''{{#sys.user_id#}}''

            4. 预算不需要带 id

            5. 只查当前年月

            6. 无数据返回0

            7. 禁止GROUP BY、禁止JOIN

            8. 只输出纯SQL，禁止输出任何中文、注释、思考内容


            【唯一输出】

            SELECT COALESCE((SELECT month_budget FROM public.expenses WHERE bill_month=to_char(now(),''YYYY-MM'')
            LIMIT 1),0) AS monthly_budget, COALESCE((SELECT SUM(amount) FROM public.expenses
            WHERE id=''{{#sys.user_id#}}'' AND type=''支出'' AND to_char(date,''YYYY-MM'')=to_char(now(),''YYYY-MM'')),0)
            AS total_spent;'
